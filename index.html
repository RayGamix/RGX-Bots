<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RayGamix Engine - Live 3D World</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@font-face{font-family:'RayGamix Neue';src:url('https://raygamix.com/RayGamix%20Neue/RayGamix_Neue_regular.ttf') format('truetype')}
*{box-sizing:border-box;user-select:none;font-family:'RayGamix Neue',sans-serif!important}
body,html{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#87ceeb}
#hud-top{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(0,0,0,0.95),rgba(0,20,40,0.95));color:#fff;border:2px solid rgba(0,183,255,0.8);padding:12px 28px;border-radius:35px;z-index:2000;display:flex;gap:20px;align-items:center;font-weight:900;font-size:14px;box-shadow:0 8px 32px rgba(0,183,255,0.3);backdrop-filter:blur(10px)}
.chip-accent{color:#00b7ff;text-shadow:0 0 10px rgba(0,183,255,0.5)}
.chip-gold{color:#ffc107;text-shadow:0 0 10px rgba(255,193,7,0.5)}
.chip-green{color:#00e676;text-shadow:0 0 10px rgba(0,230,118,0.5)}
.chip-red{color:#ff4444;text-shadow:0 0 10px rgba(255,68,68,0.5)}
#health-bar-container{position:fixed;top:90px;left:50%;transform:translateX(-50%);width:280px;height:24px;background:rgba(0,0,0,0.8);border:2px solid #00b7ff;border-radius:12px;z-index:2000;overflow:hidden;box-shadow:0 4px 16px rgba(0,183,255,0.3)}
#health-bar-fill{height:100%;width:100%;background:linear-gradient(90deg,#00e676,#00b7ff);border-radius:10px;transition:width 0.3s ease}
#health-bar-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-weight:900;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
.overhead-anchor{position:absolute;top:0;left:0;pointer-events:none;will-change:transform;transform:translate3d(0,0,0);z-index:1800;display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.player-nametag{background:linear-gradient(135deg,rgba(0,0,0,0.9),rgba(0,30,60,0.9));border:2px solid #00b7ff;color:#fff;font-weight:900;font-size:11px;padding:3px 12px;border-radius:14px;text-shadow:0 0 8px rgba(0,183,255,0.5);white-space:nowrap}
.player-health-mini{width:60px;height:6px;background:rgba(0,0,0,0.8);border:1px solid #00b7ff;border-radius:3px;overflow:hidden;margin-top:2px}
.player-health-mini-fill{height:100%;background:linear-gradient(90deg,#00e676,#00b7ff)}
#canvas-container{width:100vw;height:100vh;display:block}
</style>
</head>
<body>

<div id="hud-top">
  <div>🎮 <span class="chip-accent">Neon Obby Parkour</span></div>
  <div>⚡ FPS: <span id="fps-val" class="chip-accent">60</span></div>
  <div>👤 <span class="chip-accent">Ray</span></div>
  <div>🤖 Bots Active: <span class="chip-green">5 / 5</span></div>
</div>

<div id="health-bar-container">
  <div id="health-bar-fill" style="width:100%"></div>
  <div id="health-bar-text">100 / 100</div>
</div>

<div id="overhead-ui-layer" style="position:fixed;inset:0;pointer-events:none;z-index:1800"></div>
<div id="canvas-container"></div>

<script>
const AVATAR_ROUNDNESS = 0.10;
const MAX_FRONTEND_BOTS = 5; // Absolute unbreakable 5-bot limit

function createRoundedBoxGeometry(width, height, depth, radius, segments) {
    segments = segments || 16;
    const maxRadius = Math.min(width, height, depth) / 2 - 0.0001;
    if (radius > maxRadius) radius = maxRadius;
    if (radius < 0) radius = 0;
    const geo = new THREE.BoxGeometry(width, height, depth, segments, segments, segments);
    const pos = geo.attributes.position;
    const halfW = width / 2 - radius;
    const halfH = height / 2 - radius;
    const halfD = depth / 2 - radius;
    const v = new THREE.Vector3(), c = new THREE.Vector3(), off = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        c.set(Math.max(-halfW, Math.min(halfW, v.x)), Math.max(-halfH, Math.min(halfH, v.y)), Math.max(-halfD, Math.min(halfD, v.z)));
        off.set(v.x - c.x, v.y - c.y, v.z - c.z);
        const len = off.length();
        if (len > 0.0001) {
            off.multiplyScalar(radius / len);
            v.set(c.x + off.x, c.y + off.y, c.z + off.z);
        } else {
            v.set(c.x, c.y, c.z);
        }
        pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
}

function createPlayerMaterial(c){ return new THREE.MeshStandardMaterial({color:c, roughness:0.4}); }

function buildPlayerRig(t, config, name){
  const root = new THREE.Group();
  const skin = config.headColor || 0xffdbac;
  const torsoCol = config.torsoColor || 0x00b7ff;
  const legsCol = config.legsColor || 0x0033aa;

  const head = new THREE.Mesh(createRoundedBoxGeometry(1.25, 1.25, 1.25, AVATAR_ROUNDNESS, 16), createPlayerMaterial(skin));
  head.position.y = 4.8;
  head.castShadow = true;

  const torso = new THREE.Mesh(createRoundedBoxGeometry(1.8, 2.2, 1.0, AVATAR_ROUNDNESS, 16), createPlayerMaterial(torsoCol));
  torso.position.y = 3.1;
  torso.castShadow = true;

  function mk(col, x, y, isLeg){
    const w = isLeg ? 0.85 : 0.8, h = isLeg ? 2.35 : 2.2, d = isLeg ? 0.85 : 0.8;
    const p = new THREE.Group();
    p.position.set(x, y, 0);
    const m = new THREE.Mesh(createRoundedBoxGeometry(w, h, d, AVATAR_ROUNDNESS, 16), createPlayerMaterial(col));
    m.position.set(0, -h/2, 0);
    m.castShadow = true;
    p.add(m);
    return p;
  }

  root.add(head, torso, mk(skin, -1.4, 4.2, false), mk(skin, 1.4, 4.2, false), mk(legsCol, -0.5, 2.2, true), mk(legsCol, 0.5, 2.2, true));
  t.group = root;

  const ov = document.createElement('div');
  ov.className = 'overhead-anchor';
  ov.innerHTML = '<div class="player-nametag">' + name + '</div><div class="player-health-mini"><div class="player-health-mini-fill" style="width:100%"></div></div>';
  document.getElementById('overhead-ui-layer').appendChild(ov);
  t.overheadElement = ov;
}

let scene, camera, renderer, clock;
let localPlayer = { group: null, moveVelocity: new THREE.Vector3() };
let frontendBots = [];
const keys = {};
let cameraYaw = 0, cameraPitch = 0.3;

function initFrontendBots(){
  const botNames = ["Explorer_Bot", "ParkourPro", "SpeedyBot", "NeonStalker", "MasterBot"];
  for(let i = 0; i < MAX_FRONTEND_BOTS; i++){
    const bot = {
      username: botNames[i],
      group: null,
      position: new THREE.Vector3((Math.random() - 0.5) * 25, 1, -10 - Math.random() * 25),
      targetPos: new THREE.Vector3(),
      moveTimer: 0
    };
    buildPlayerRig(bot, { headColor: 0xffdbac, torsoColor: 0xff5555, legsColor: 0x00b7ff }, bot.username);
    bot.group.position.copy(bot.position);
    scene.add(bot.group);
    frontendBots.push(bot);
  }
}

function updateFrontendBots(delta){
  frontendBots.forEach(bot => {
    bot.moveTimer += delta;
    if(bot.moveTimer > 3.5){
      bot.moveTimer = 0;
      bot.targetPos.set((Math.random() - 0.5) * 35, 1, (Math.random() - 0.5) * 35);
    }
    if(bot.targetPos.length() > 0){
      const dir = new THREE.Vector3().subVectors(bot.targetPos, bot.group.position);
      if(dir.length() > 0.8){
        dir.normalize();
        bot.group.position.addScaledVector(dir, 3.5 * delta);
        bot.group.rotation.y = Math.atan2(dir.x, dir.z);
      }
    }
    updateOverhead(bot);
  });
}

function updateOverhead(c){
  if(!c.group || !c.overheadElement) return;
  const _ohVec = new THREE.Vector3();
  c.group.getWorldPosition(_ohVec);
  _ohVec.y += 6.8;
  _ohVec.project(camera);
  if(_ohVec.z < -1 || _ohVec.z > 1){
    c.overheadElement.style.display = 'none';
    return;
  }
  c.overheadElement.style.display = '';
  const x = (_ohVec.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-(_ohVec.y * 0.5) + 0.5) * window.innerHeight;
  c.overheadElement.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
}

function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.0055);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 600);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(50, 100, 50);
  scene.add(sun);

  // Baseplate
  const base = new THREE.Mesh(new THREE.BoxGeometry(150, 2, 150), new THREE.MeshStandardMaterial({color: 0x111a24}));
  base.position.set(0, -1, 0);
  scene.add(base);

  // Local Player
  buildPlayerRig(localPlayer, { headColor: 0xffdbac, torsoColor: 0x00b7ff, legsColor: 0x0033aa }, "Ray");
  localPlayer.group.position.set(0, 1, 0);
  scene.add(localPlayer.group);

  // Spawn exactly 5 visible bots
  initFrontendBots();

  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('mousemove', e => {
    if(e.buttons === 2){
      cameraYaw -= e.movementX * 0.005;
      cameraPitch = Math.max(-0.8, Math.min(1.5, cameraPitch + e.movementY * 0.005));
    }
  });
  window.addEventListener('contextmenu', e => e.preventDefault());

  clock = new THREE.Clock();
  requestAnimationFrame(loop);
}

function loop(){
  requestAnimationFrame(loop);
  const delta = Math.min(clock.getDelta(), 0.05);

  let mx = 0, mz = 0;
  if(keys['w'] || keys['arrowup']) mz -= 1;
  if(keys['s'] || keys['arrowdown']) mz += 1;
  if(keys['a'] || keys['arrowleft']) mx -= 1;
  if(keys['d'] || keys['arrowright']) mx += 1;
  const il = Math.hypot(mx, mz);

  if(il > 0.01){
    const fx = Math.sin(cameraYaw), fz = Math.cos(cameraYaw);
    const rx = Math.cos(cameraYaw), rz = -Math.sin(cameraYaw);
    localPlayer.moveVelocity.x = ((mx/il)*rx + (mz/il)*fx) * 12;
    localPlayer.moveVelocity.z = ((mx/il)*rz + (mz/il)*fz) * 12;
  } else {
    localPlayer.moveVelocity.x *= 0.8;
    localPlayer.moveVelocity.z *= 0.8;
  }
  localPlayer.group.position.x += localPlayer.moveVelocity.x * delta;
  localPlayer.group.position.z += localPlayer.moveVelocity.z * delta;

  updateFrontendBots(delta);
  updateOverhead(localPlayer);

  const dist = 40;
  camera.position.set(
    localPlayer.group.position.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * dist,
    localPlayer.group.position.y + 4 + Math.sin(cameraPitch) * dist,
    localPlayer.group.position.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * dist
  );
  camera.lookAt(localPlayer.group.position.x, localPlayer.group.position.y + 2, localPlayer.group.position.z);

  renderer.render(scene, camera);
}

window.onload = init;
</script>
</body>
</html>
